[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "basicToDo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "anyio>=4.14.2",
    "fastapi[standard]>=0.142.2",
    "python-multipart>=0.0.31",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.54,<2.1",
    "starlette>=1.3.1",
    "uvicorn>=0.34.2",
]
[tool.setuptools_scm]
version = "v0.1.0"

[tool.setuptools]
packages = ["backend"]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
incremental = false
ignore_errors = false
pretty = true
show_error_context = true
show_traceback = true
strict_optional = true
warn_incomplete_stub = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[dependency-groups]
dev = [
    "black>=25.1.0",
    "factory-boy>=3.3.0",
    "httpx2>=2.13.1",
    "hypothesis>=6.168.5",
    "mypy>=1.16.0",
    "pylint>=3.3.7",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "types-greenlet>=3.2.0.20250417",
    "types-pygments>=2.19.0.20250516",
    "types-pyyaml>=6.0.12.20250516",
    "types-ujson>=5.10.0.20250326",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=backend/app",
    "--cov-report=term-missing",
    "--cov-report=html:backend/htmlcov",
    "--cov-report=xml:backend/coverage.xml",
]

[tool.coverage.run]
source = ["backend/app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]
branch = true
relative_files = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80.0
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.alembic]
# Run from the repository root. The application still creates its schema
# with create_all; stamp an existing database only after
# backend/migrations/check_baseline.py accepts it (analysis/basictodo/PLAYBOOK.md).
script_location = "%(here)s/backend/migrations"
prepend_sys_path = ["."]
