---
# Keeps the SHA-pinned actions in .github/workflows/ current. Dependabot
# rewrites both the commit SHA and the trailing "# vX.Y.Z" comment.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week before proposing a fresh release, so a compromised
    # version has time to be noticed and pulled first.
    cooldown:
      default-days: 7
    groups:
      # codeql-action/init and codeql-action/analyze are separate
      # dependencies to Dependabot, but must run the same version: analyze
      # rejects a config written by a different init. Listed first so it
      # takes precedence, and for all update types, majors included.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
