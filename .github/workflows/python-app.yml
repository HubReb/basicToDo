---
name: Python Application CI

on:
  push:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests & Quality Checks

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.7.16"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --all-extras --dev

      - name: Initialize database schema
        run: uv run python backend/scripts/init_db.py

      - name: Run MyPy type checking
        run: uv run mypy backend/app/
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          uv run pytest backend/tests/ \
            --cov=backend/app \
            --cov-report=term-missing \
            --cov-report=xml:backend/coverage.xml \
            --cov-report=html:backend/htmlcov \
            --junitxml=backend/junit/test-results.xml \
            --cov-fail-under=80
        continue-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: backend/junit/test-results.xml
        if: always()

      - name: Upload coverage report (HTML)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage-html
          path: backend/htmlcov/
        if: always()

      - name: Upload coverage report (XML)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage-xml
          path: backend/coverage.xml
        if: always()

      - name: Upload coverage data for PR comment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: backend-coverage-data
          path: .coverage
          include-hidden-files: true
          retention-days: 1

  # Runs in its own job so the write token never coexists with the
  # third-party packages that `uv sync` installs and pytest executes.
  coverage-comment:
    name: Comment coverage on PR
    needs: backend
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-coverage-data

      - name: Comment coverage on PR
        uses: py-cov-action/python-coverage-comment-action@50d15ff8768f6d897b04e5a0805bd1a98f7096c4 # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_PATH: .

  Lint:
    name: Lint the python code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Install a specific version of uv.
          version: "0.7.16"
      - name: Enable caching
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: run linter
        run: |
              cd backend
              uv run pylint app/*py --exit-zero
